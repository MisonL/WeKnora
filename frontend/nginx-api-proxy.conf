# Shared backend proxy settings for the /api/ and /mcp/ locations.
#
# The API, skill-upload and MCP locations share headers and streaming behavior.
# Only proxy_pass stays in each location, since a regex location cannot carry
# a URI in it.
#
# This file is copied verbatim, not run through envsubst, so $host and friends
# survive as nginx variables.

# Preserve the public port for same-origin embed API checks on HTTP deployments.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 连接和重试配置
proxy_connect_timeout 30s;                 # 连接超时时间
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 3;               # 重试次数
proxy_next_upstream_timeout 30s;           # 重试超时时间

# SSE 相关配置
proxy_http_version 1.1;                    # 使用 HTTP/1.1
proxy_set_header Connection "";            # 禁用 Connection: close，保持连接打开
chunked_transfer_encoding on;              # 分块传输编码开启：proxy_buffering off 时必须保留分块帧，否则响应既无 Content-Length 又无 Transfer-Encoding，客户端无法定界
proxy_buffering off;                       # 关闭缓冲
proxy_cache off;                           # 关闭缓存
proxy_read_timeout 3600s;                  # 增加读取超时时间
proxy_send_timeout 3600s;                  # 增加发送超时时间

# 请求方向也不要缓冲。上面那条 proxy_buffering 管的是响应；请求体的默认值
# 是 proxy_request_buffering on，nginx 会先把整个 body 收完、整份写进
# client_temp，然后才去连后端。对上传端点这意味着两件事：
#
#   1. 后端的准入闸门形同虚设。8 MiB、8 MiB/10s 的慢速上传，开着请求缓冲时
#      客户端把 8388608 字节全发完了（10323 ms）才拿到 429；关掉后 359 ms、
#      发了 262144 字节就拿到。
#   2. 每个上传都多一份写盘。12 MiB 的请求，nginx worker 的 write_bytes
#      多出 12582912 字节（关掉后是 0）。这份写落在容器 overlay 上，也就是
#      系统盘。
#
# 不会引入 POST 被重放的风险：proxy_next_upstream 默认不重试非幂等请求，上面
# 那行不带 non_idempotent，所以 429/503 不会被当成失败重发（实测上游只收到
# 一次 POST）。反过来说，若将来要加 non_idempotent，必须先去掉这一行——请求
# 体已经流给上游，重放没有 body 可发。
proxy_request_buffering off;

# 后端对请求体有 30 分钟上限的读截止（middleware.RequestBodyDeadline），但那条
# 中间件在 HTTP/2 等无法 SetReadDeadline 的连接上会退出，此时这里是唯一的界。
# client_body_timeout 是“两次读之间”的间隔，不是整段传输的总时长，所以慢速但
# 持续发送的上传不会被它误杀；它只杀真正停滞的客户端。
client_body_timeout 120s;
